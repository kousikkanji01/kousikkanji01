# Generates the animated contribution snake referenced in README.md.
#
# ONE-TIME SETUP:
#   1. In the kousikkanji01/kousikkanji01 repo, add this file at exactly:
#        .github/workflows/snake.yml
#   2. Go to Settings -> Actions -> General -> Workflow permissions,
#      select "Read and write permissions", then Save.
#   3. Go to the Actions tab, select "generate contribution snake",
#      and click "Run workflow" (or just push this file — it runs on push to main too).
#   4. Wait about a minute, then refresh your profile page. The snake
#      re-generates automatically every 12 hours after that.

name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kousikkanji01
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3e6883&color_dots=#f5fbff,#d5f1fe,#b9e7fd,#9addfd,#7dd3fc
            dist/github-contribution-grid-snake-dark.svg?color_snake=#c4ebfe&color_dots=#162129,#314f60,#497a93,#64a8ca,#9edefd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
